server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER:payment_app}
    password: ${MYSQL_PASSWORD:app-password-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:payment}
    password: ${RABBITMQ_PASSWORD:rabbit-password-change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
    username: elastic
    password: ${ELASTIC_PASSWORD:changeme}

app:
  security:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SECRET:dev-internal-secret-change-me}
  identity-service:
    url: ${IDENTITY_SERVICE_URL:identity-service}
    port: ${IDENTITY_SERVICE_PORT:8082}
  organization-service:
    url: ${ORGANIZATION_SERVICE_URL:organization-service}
    port: ${ORGANIZATION_SERVICE_PORT:8083}
  outbox:
    relay-interval-ms: 1000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info