spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
app:
  security:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL}
  internal-secret: ${INTERNAL_SECRET}
  identity-service:
    url: ${IDENTITY_SERVICE_URL}
    port: ${IDENTITY_SERVICE_PORT:8082}
  organization-service:
    url: ${ORGANIZATION_SERVICE_URL}
    port: ${ORGANIZATION_SERVICE_PORT:8083}
  outbox:
    relay-interval-ms: 1000
