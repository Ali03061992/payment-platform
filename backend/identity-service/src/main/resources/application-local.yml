spring:
  datasource:
    url: jdbc:mysql://localhost:3307/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER:payment_app}
    password: ${MYSQL_PASSWORD:app-password-change-me}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USER:payment}
    password: ${RABBITMQ_PASSWORD:payment}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
app:
  security:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-in-production-32bytes}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SECRET:local-internal-secret-change-me}
  mail:
    from: ${MAIL_FROM:noreply@payment-platform.local}
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
