server:
  port: 8085

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER:payment_app}
    password: ${MYSQL_PASSWORD:app-password-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:payment}
    password: ${RABBITMQ_PASSWORD:rabbit-password-change-me}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

app:
  security:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-in-production-32bytes}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8081}
  push:
    enabled: ${PUSH_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info