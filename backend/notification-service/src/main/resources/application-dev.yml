spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER:payment_app}
    password: ${MYSQL_PASSWORD:app-password-change-me}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:payment}
    password: ${RABBITMQ_PASSWORD:rabbit-password-change-me}
app:
  security:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-in-production-32bytes}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL:http://api-gateway:8081}
