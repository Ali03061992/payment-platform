server:
  port: 8083

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: organization-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/organization_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sendStringParametersAsUnicode=false
    username: ${MYSQL_USER:payment_app}
    password: ${MYSQL_PASSWORD:app-password-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:payment}
    password: ${RABBITMQ_PASSWORD:rabbit-password-change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/products}
  security:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-in-production-32bytes}
    expiration: ${JWT_EXPIRATION:30m}
  gateway:
    base-url: ${API_GATEWAY_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SECRET:dev-internal-secret-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info