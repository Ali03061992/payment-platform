server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: identity-service
            uri: http://${IDENTITY_SERVICE_URL:localhost}:${IDENTITY_SERVICE_PORT:8082}
            predicates:
              - Path=/api/auth/**,/api/users/**,/api/suppliers/{supplierId}/agents/**
          - id: organization-service
            uri: http://${ORGANIZATION_SERVICE_URL:localhost}:${ORGANIZATION_SERVICE_PORT:8083}
            predicates:
              - Path=/api/admin/suppliers/**,/api/admin/shops/**,/api/suppliers/**,/api/shops/**,/api/organizations/**
          - id: payment-service
            uri: http://${PAYMENT_SERVICE_URL:localhost}:${PAYMENT_SERVICE_PORT:8084}
            predicates:
              - Path=/api/payments/**
          - id: notification-service
            uri: http://${NOTIFICATION_SERVICE_URL:localhost}:${NOTIFICATION_SERVICE_PORT:8085}
            predicates:
              - Path=/api/notifications/**

app:
  security:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration: ${JWT_EXPIRATION:30m}
    shared: false
  gateway:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info