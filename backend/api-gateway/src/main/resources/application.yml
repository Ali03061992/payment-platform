server:
  port: 8081

spring:
  application:
    name: api-gateway

app:
  security:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration: ${JWT_EXPIRATION:30m}
    shared: false
  gateway:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
