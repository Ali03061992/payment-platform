server:
  port: 8081
  tomcat:
    threads:
      max: 400
      min-spare: 20

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: api-gateway

app:
  security:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-in-production-32bytes}
    expiration: ${JWT_EXPIRATION:30m}
    shared: false
  gateway:
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:500}
    allowed-ips: ${ALLOWED_IPS:0:0:0:0:0:0:0:1,127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
