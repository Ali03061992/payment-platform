name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Needed for SonarCloud PR decoration & quality gate
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '22'
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Cleanup: delete old artifacts & workflow runs to free quota
  # ──────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup old artifacts & runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts (older than 1 day)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            jacoco-reports
            backend-jars
            frontend-coverage
            frontend-dist
            docker-images
          failOnError: false

      - name: Delete old workflow runs (older than 7 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs --paginate -q '.workflow_runs[] | select(.created_at < (now - 86400 | todate) and .status != "in_progress") | .id' | head -50 | while read id; do
            echo "Deleting run $id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$id || true
          done

  # ──────────────────────────────────────────────────────────────
  # Backend : compile + tests + JaCoCo (XML pour Sonar)
  # ──────────────────────────────────────────────────────────────
  build-backend:
    name: Backend – Build & Tests (JaCoCo)
    needs: [cleanup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for Sonar blame/branch analysis

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml', 'backend/*/pom.xml') }}
          restore-keys: maven-

      - name: Verify + coverage (unit + integration via H2)
        run: mvn -B verify -DskipITs=false --fail-at-end -Dsurefire.rerunFailingTestsCount=2
        working-directory: backend
        env:
          MAVEN_OPTS: "-Xmx1024m -XX:+UseG1GC"

      - name: Package (skipTests already covered) – generate jars
        if: always()
        run: mvn -B package -DskipTests
        working-directory: backend

      - name: Collect test reports on failure
        if: failure()
        run: |
          echo "=== Failed surefire reports ==="
          find . -path "*/surefire-reports/*.txt" -exec grep -l "FAILURE\|ERROR" {} \; -exec cat {} \; || true
          echo "=== Failed failsafe reports ==="
          find . -path "*/failsafe-reports/*.txt" -exec grep -l "FAILURE\|ERROR" {} \; -exec cat {} \; || true
        working-directory: backend

      - name: Publish JaCoCo XML to console
        if: always()
        run: |
          echo "=== JaCoCo reports ==="
          find . -path "*/target/site/jacoco/jacoco.xml" -exec ls -lh {} \; || echo "no jacoco.xml yet"
          find . -path "*/target/site/jacoco-aggregate/jacoco.xml" -exec ls -lh {} \; || echo "no aggregate yet"
        working-directory: backend

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            backend/**/target/site/jacoco/jacoco.xml
            backend/**/target/site/jacoco-aggregate/jacoco.xml
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          retention-days: 1
          if-no-files-found: warn

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 1
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────
  # Frontend : install + Karma tests + coverage (lcov pour Sonar)
  # ──────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend – Tests & Build (lcov)
    needs: [cleanup]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-platform-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage (ChromeHeadlessCI)
        run: npx ng test --code-coverage --watch=false --browsers=ChromeHeadlessCI
        # fallback pour runners sans ChromeHeadlessCI custom launcher -> ChromeHeadless
        # crée coverage/payment-platform-ui/lcov.info

      - name: Check coverage output
        if: always()
        run: |
          ls -R coverage || echo "no coverage dir"
          cat coverage/payment-platform-ui/lcov.info | head -n 20 || cat coverage/lcov.info | head -n 20 || echo "no lcov.info"

      - name: Build Angular (production)
        run: npx ng build --configuration production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            payment-platform-ui/coverage/**
            frontend/coverage/**
          retention-days: 1
          if-no-files-found: warn

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: payment-platform-ui/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Sonar – Backend (Maven)
  # Se déclenche après backend tests et nécessite SONAR_TOKEN
  # Supporte SonarQube local (http://localhost:9000) ou SonarCloud
  # https://sonarcloud.io via secrets.SONAR_HOST_URL + SONAR_TOKEN + SONAR_ORGANIZATION
  # ──────────────────────────────────────────────────────────────
  sonar-backend:
    name: SonarQube – Backend
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Check Sonar token availability
        id: check-token
        run: echo "available=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        if: steps.check-token.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Sonar packages
        if: steps.check-token.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: SonarCloud/Binary cache
        if: steps.check-token.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/sonarsource
          key: sonar-maven-${{ hashFiles('backend/pom.xml') }}

      - name: SonarQube analysis (Maven) – rebuild with coverage + scan
        if: steps.check-token.outputs.available == 'true'
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          ORG_ARGS=""
          if [ -n "${{ secrets.SONAR_ORGANIZATION }}" ]; then
            ORG_ARGS="-Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}"
          fi
          # Re-run verify pour garantir jacoco.xml frais, puis push vers Sonar
          mvn -B verify sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            $ORG_ARGS

      # Quality Gate – échoue si rouge (polling 5min)
      - name: SonarQube Quality Gate
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Sonar – Frontend (scanner CLI)
  # ──────────────────────────────────────────────────────────────
  sonar-frontend:
    name: SonarQube – Frontend
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Check Sonar token availability
        id: check-token
        run: echo "available=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.check-token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Install dependencies
        if: steps.check-token.outputs.available == 'true'
        working-directory: payment-platform-ui
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage for Sonar
        if: steps.check-token.outputs.available == 'true'
        working-directory: payment-platform-ui
        run: npx ng test --code-coverage --watch=false --browsers=ChromeHeadlessCI

      - name: Verify lcov generation
        if: steps.check-token.outputs.available == 'true'
        run: |
          ls -lah payment-platform-ui/coverage/payment-platform-ui/lcov.info || ls -lah payment-platform-ui/coverage/lcov.info || echo "lcov not found"
          head -n 20 payment-platform-ui/coverage/payment-platform-ui/lcov.info 2>/dev/null || head -n 20 payment-platform-ui/coverage/lcov.info 2>/dev/null || echo "no lcov"

      - name: SonarQube Scan (Frontend)
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          projectBaseDir: payment-platform-ui
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: SonarQube Quality Gate (Frontend)
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Docker images – dépend du build (pas bloqué par Sonar)
  # ──────────────────────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: /tmp/jars

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/frontend-dist

      - name: Build backend images
        working-directory: backend
        run: |
          for service in identity-service organization-service payment-service notification-service api-gateway; do
            docker build -t payment-platform/$service:latest \
              --build-arg SERVICE_NAME=$service .
          done

      - name: Build frontend image
        working-directory: .
        run: docker build -t payment-platform/angular:latest -f frontend/Dockerfile .

      - name: Save Docker images
        run: |
          docker save payment-platform/{identity-service,organization-service,payment-service,notification-service,api-gateway,angular}:latest \
            | gzip > docker-images.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.tar.gz
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # E2E (Cypress) – lance le stack via docker-compose
  # ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker images
        run: docker load < docker-images.tar.gz

      - name: Install Cypress deps
        working-directory: payment-platform-ui
        run: npm ci --legacy-peer-deps

      - name: Start services
        working-directory: .
        run: docker compose -f deploy/docker-compose.yml up -d --wait
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          JWT_SECRET: test-secret-key-for-ci-must-be-at-least-64-chars-long-for-hs512
          JWT_EXPIRATION: 86400000
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          RATE_LIMIT_PER_MINUTE: 100
          INTERNAL_SECRET: test-internal-secret

      - name: Wait for gateway & frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/actuator/health && echo "gateway up" && break || sleep 4
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && echo "frontend up" && break || sleep 2
          done

      - name: Run Cypress tests
        working-directory: payment-platform-ui
        run: npx cypress run

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose -f deploy/docker-compose.yml down -v

      - name: Collect E2E logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
        working-directory: .
