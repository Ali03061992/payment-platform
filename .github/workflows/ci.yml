name: CI

# Stratégie de branching :
#   release/**            → build + tests → déploiement AUTO vers TEST
#   master                → build + tests → déploiement AUTO vers PROD
#   develop (et autres)   → build + tests uniquement, AUCUN déploiement
#   manuel (Actions → Run workflow) → publication vers TEST ou PROD au choix
# Branche de production : `master`.
on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement de publication manuelle'
        required: true
        default: 'test'
        type: choice
        options: [test, prod]

# Needed for SonarCloud PR decoration & quality gate + GHCR push
permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Ne jamais interrompre un déploiement PROD en cours.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  JAVA_VERSION: '26-ea'
  JAVA_DISTRIBUTION: 'temurin'
  NODE_VERSION: '22'
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Cleanup: delete old artifacts & workflow runs to free quota
  # ──────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup old artifacts & runs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete old artifacts (older than 1 day)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            jacoco-reports
            backend-jars
            frontend-coverage
            frontend-dist
          failOnError: false

      - name: Delete old workflow runs (older than 7 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs --paginate -q '.workflow_runs[] | select(.created_at < (now - 86400 | todate) and .status != "in_progress") | .id' | head -50 | while read id; do
            echo "Deleting run $id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$id || true
          done

  # ──────────────────────────────────────────────────────────────
  # Backend : compile + tests + JaCoCo (XML pour Sonar)
  # ──────────────────────────────────────────────────────────────
  build-backend:
    name: Backend – Build & Tests (JaCoCo)
    needs: [cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for Sonar blame/branch analysis

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml', 'backend/*/pom.xml') }}
          restore-keys: maven-

      - name: Verify + coverage (unit + integration via H2)
        run: mvn -B verify -DskipITs=false --fail-at-end -Dsurefire.rerunFailingTestsCount=2
        working-directory: backend
        env:
          MAVEN_OPTS: "-Xmx1024m -XX:+UseG1GC"

      - name: Package (skipTests already covered) – generate jars
        if: always()
        run: mvn -B package -DskipTests
        working-directory: backend

      - name: Collect test reports on failure
        if: failure()
        run: |
          echo "=== Failed surefire reports ==="
          find . -path "*/surefire-reports/*.txt" -exec grep -l "FAILURE\|ERROR" {} \; -exec cat {} \; || true
          echo "=== Failed failsafe reports ==="
          find . -path "*/failsafe-reports/*.txt" -exec grep -l "FAILURE\|ERROR" {} \; -exec cat {} \; || true
        working-directory: backend

      - name: Publish JaCoCo XML to console
        if: always()
        run: |
          echo "=== JaCoCo reports ==="
          find . -path "*/target/site/jacoco/jacoco.xml" -exec ls -lh {} \; || echo "no jacoco.xml yet"
          find . -path "*/target/site/jacoco-aggregate/jacoco.xml" -exec ls -lh {} \; || echo "no aggregate yet"
        working-directory: backend

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            backend/**/target/site/jacoco/jacoco.xml
            backend/**/target/site/jacoco-aggregate/jacoco.xml
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          retention-days: 1
          if-no-files-found: warn

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 1
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────
  # Frontend : install + Karma tests + coverage (lcov pour Sonar)
  # ──────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend – Tests & Build (lcov)
    needs: [cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: payment-platform-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage (ChromeHeadlessCI)
        # Fallback explicite : si le launcher custom manque, repli sur ChromeHeadless.
        # Crée coverage/payment-platform-ui/lcov.info
        run: npx ng test --code-coverage --watch=false --browsers=ChromeHeadlessCI || npx ng test --code-coverage --watch=false --browsers=ChromeHeadless

      - name: Check coverage output
        if: always()
        run: |
          ls -R coverage || echo "no coverage dir"
          cat coverage/payment-platform-ui/lcov.info | head -n 20 || cat coverage/lcov.info | head -n 20 || echo "no lcov.info"

      - name: Build Angular (production)
        run: npx ng build --configuration production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: payment-platform-ui/coverage/**
          retention-days: 1
          if-no-files-found: warn

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: payment-platform-ui/dist/
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────
  # Sonar – Backend (Maven)
  # Se déclenche après backend tests et nécessite SONAR_TOKEN
  # Supporte SonarQube local (http://localhost:9000) ou SonarCloud
  # https://sonarcloud.io via secrets.SONAR_HOST_URL + SONAR_TOKEN + SONAR_ORGANIZATION
  # ──────────────────────────────────────────────────────────────
  sonar-backend:
    name: SonarQube – Backend
    runs-on: ubuntu-24.04
    needs: [build-backend]
    timeout-minutes: 30
    steps:
      - name: Check Sonar token availability
        id: check-token
        run: echo "available=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - name: Set up JDK 26
        if: steps.check-token.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Sonar packages
        if: steps.check-token.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: SonarCloud/Binary cache
        if: steps.check-token.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/sonarsource
          key: sonar-maven-${{ hashFiles('backend/pom.xml') }}

      - name: SonarQube analysis (Maven) – rebuild with coverage + scan
        if: steps.check-token.outputs.available == 'true'
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          ORG_ARGS=""
          if [ -n "${{ secrets.SONAR_ORGANIZATION }}" ]; then
            ORG_ARGS="-Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}"
          fi
          # Re-run verify pour garantir jacoco.xml frais, puis push vers Sonar
          mvn -B verify sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            $ORG_ARGS

      # Quality Gate – échoue si rouge (polling 5min)
      - name: SonarQube Quality Gate
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Sonar – Frontend (scanner CLI)
  # ──────────────────────────────────────────────────────────────
  sonar-frontend:
    name: SonarQube – Frontend
    runs-on: ubuntu-24.04
    needs: [build-frontend]
    timeout-minutes: 30
    steps:
      - name: Check Sonar token availability
        id: check-token
        run: echo "available=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.available == 'true'
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.check-token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Install dependencies
        if: steps.check-token.outputs.available == 'true'
        working-directory: payment-platform-ui
        run: npm ci --legacy-peer-deps

      - name: Run tests with coverage for Sonar
        if: steps.check-token.outputs.available == 'true'
        working-directory: payment-platform-ui
        run: npx ng test --code-coverage --watch=false --browsers=ChromeHeadlessCI

      - name: Verify lcov generation
        if: steps.check-token.outputs.available == 'true'
        run: |
          ls -lah payment-platform-ui/coverage/payment-platform-ui/lcov.info || ls -lah payment-platform-ui/coverage/lcov.info || echo "lcov not found"
          head -n 20 payment-platform-ui/coverage/payment-platform-ui/lcov.info 2>/dev/null || head -n 20 payment-platform-ui/coverage/lcov.info 2>/dev/null || echo "no lcov"

      - name: SonarQube Scan (Frontend)
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-scan-action@v5
        with:
          projectBaseDir: payment-platform-ui
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: SonarQube Quality Gate (Frontend)
        if: steps.check-token.outputs.available == 'true'
        uses: sonarsource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Images Docker : build + push GHCR (pas de tests/sonar ici, déjà faits).
  # Tags : <ref-slug> toujours ; test-latest sur release/** ;
  # prod-latest sur master/tags. La VM ne fait que `pull` (jamais de build).
  # ──────────────────────────────────────────────────────────────
  build-images:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [build-backend, build-frontend, sonar-backend, sonar-frontend]
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR (si publication prévue)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          SLUG=$(echo "$GITHUB_REF_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          SHA_TAG="sha-${GITHUB_SHA::12}"
          ENV_TAG=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.environment }}" == "prod" ]]; then ENV_TAG="prod-latest"; else ENV_TAG="test-latest"; fi
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            ENV_TAG="test-latest"
          elif [[ "$GITHUB_REF" == refs/heads/master ]] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ENV_TAG="prod-latest"
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "env_tag=$ENV_TAG" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER slug=$SLUG sha_tag=$SHA_TAG env_tag=$ENV_TAG"

      - name: Build backend images (+ push si release/master/tag)
        working-directory: backend
        run: |
          REG="ghcr.io/${{ steps.tags.outputs.owner }}/payment-platform"
          SLUG="${{ steps.tags.outputs.slug }}"
          SHA_TAG="${{ steps.tags.outputs.sha_tag }}"
          ENV_TAG="${{ steps.tags.outputs.env_tag }}"
          for service in identity-service organization-service payment-service notification-service api-gateway; do
            for attempt in 1 2 3; do
              echo "Build $service (tentative $attempt/3)..."
              if docker build -t "$REG/$service:$SLUG" \
                --build-arg SERVICE_NAME=$service .; then
                break
              fi
              echo "Echec tentative $attempt (souvent un 500 transitoire du registre Docker Hub), pause 30s..."
              sleep 30
              if [ "$attempt" = "3" ]; then echo "Build $service en echec apres 3 tentatives."; exit 1; fi
            done
            if [ -n "$ENV_TAG" ]; then
              docker tag "$REG/$service:$SLUG" "$REG/$service:$SHA_TAG"
              docker tag "$REG/$service:$SLUG" "$REG/$service:$ENV_TAG"
              docker push "$REG/$service:$SLUG"
              docker push "$REG/$service:$SHA_TAG"
              docker push "$REG/$service:$ENV_TAG"
            fi
          done

      - name: Build frontend image (+ push si release/master/tag)
        working-directory: .
        run: |
          REG="ghcr.io/${{ steps.tags.outputs.owner }}/payment-platform"
          SLUG="${{ steps.tags.outputs.slug }}"
          SHA_TAG="${{ steps.tags.outputs.sha_tag }}"
          ENV_TAG="${{ steps.tags.outputs.env_tag }}"
          for attempt in 1 2 3; do
            echo "Build angular (tentative $attempt/3)..."
            if docker build -t "$REG/angular:$SLUG" -f Dockerfile .; then
              break
            fi
            echo "Echec tentative $attempt, pause 30s..."
            sleep 30
            if [ "$attempt" = "3" ]; then echo "Build angular en echec apres 3 tentatives."; exit 1; fi
          done
          if [ -n "$ENV_TAG" ]; then
            docker tag "$REG/angular:$SLUG" "$REG/angular:$SHA_TAG"
            docker tag "$REG/angular:$SLUG" "$REG/angular:$ENV_TAG"
            docker push "$REG/angular:$SLUG"
            docker push "$REG/angular:$SHA_TAG"
            docker push "$REG/angular:$ENV_TAG"
          fi

  # ──────────────────────────────────────────────────────────────
  # Publication TEST – auto sur release/**, ou manuelle
  # Déploiement SSH vers la VM OVH de test : git pull + pull images GHCR + up.
  # Secrets requis : OVH_TEST_HOST, OVH_TEST_USER, OVH_TEST_SSH_KEY
  # (optionnels : OVH_TEST_PORT=22, OVH_TEST_DIR=/opt/payment-platform,
  #  OVH_TEST_URL pour le health check). Le fichier deploy/.env doit
  # exister sur la VM (modèle : deploy/.env.example).
  # ──────────────────────────────────────────────────────────────
  deploy-test:
    name: Publish → TEST (VM OVH)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-images]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')
    steps:
      - name: Check OVH test config (real / fake / missing)
        id: check
        run: |
          HOST="${{ secrets.OVH_TEST_HOST }}"
          if [ -z "$HOST" ] || [ -z "${{ secrets.OVH_TEST_USER }}" ] || [ -z "${{ secrets.OVH_TEST_SSH_KEY }}" ]; then
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets OVH TEST absents : déploiement simulé."
          elif [[ "$HOST" == *.invalid ]]; then
            echo "mode=fake" >> "$GITHUB_OUTPUT"
            echo "Hôte fake détecté ($HOST) : déploiement simulé."
          else
            echo "mode=real" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug SSH key format (secret jamais affiché)
        if: steps.check.outputs.mode == 'real'
        run: |
          KEY="${{ secrets.OVH_TEST_SSH_KEY }}"
          echo "longueur: ${#KEY} chars"
          echo "$KEY" | head -n 1 | grep -q "BEGIN OPENSSH PRIVATE KEY" && echo "header OK" || echo "header BAD"
          echo "$KEY" | tail -n 1 | grep -q "END OPENSSH PRIVATE KEY" && echo "footer OK" || echo "footer BAD"
          if echo "$KEY" | grep -q "$(printf '\r')"; then echo "CRLF DETECTE - PROBLEM (recopier en LF)"; else echo "LF only OK"; fi
          echo "lignes: $(echo "$KEY" | wc -l)"
          echo "$KEY" > /tmp/ci_key && chmod 600 /tmp/ci_key
          ssh-keygen -y -f /tmp/ci_key > /tmp/ci_key.pub 2>/dev/null && ssh-keygen -lf /tmp/ci_key.pub || echo "CLE ILLISIBLE"
          rm -f /tmp/ci_key /tmp/ci_key.pub
          U="${{ secrets.OVH_TEST_USER }}"; H="${{ secrets.OVH_TEST_HOST }}"
          echo "user len: ${#U} (attendu 6), host len: ${#H} (attendu 11)"
          echo "user hex: $(echo -n "$U" | od -An -tx1 | tr -d ' \n')"
          echo "host hex: $(echo -n "$H" | od -An -tx1 | tr -d ' \n')"

      - name: Deploy to OVH test VM
        if: steps.check.outputs.mode == 'real'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_TEST_HOST }}
          username: ${{ secrets.OVH_TEST_USER }}
          key: ${{ secrets.OVH_TEST_SSH_KEY }}
          port: ${{ secrets.OVH_TEST_PORT || '22' }}
          script: |
            sudo -i <<'ROOT_EOF'
            set -e
            APP_DIR="${{ secrets.OVH_TEST_DIR || '/opt/payment-platform' }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout --detach "${{ github.sha }}"
            # Images immuables construites en CI pour ce commit exact.
            export IMAGE_TAG="${{ needs.build-images.outputs.sha_tag }}"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            docker compose -f deploy/docker-compose.yml ps
            # Ménage : images pendantes + cache de build (plus aucun build ici).
            docker image prune -f
            docker builder prune -af
            chown -R "${SUDO_USER:-root}:${SUDO_USER:-root}" "$APP_DIR"
            ROOT_EOF

      - name: Fake deploy TEST (simulation, run vert)
        if: steps.check.outputs.mode != 'real'
        run: |
          echo "=============================================="
          echo " FAKE deploy TEST (mode: ${{ steps.check.outputs.mode }})"
          echo " Branche : ${{ github.ref_name }}"
          echo " Hote    : ${{ secrets.OVH_TEST_HOST || 'vm-test.invalid (non defini)' }}"
          echo " Simule (root) : git pull + pull GHCR + up -d + prune"
          echo "=============================================="

      - name: Health check TEST (front + API)
        if: steps.check.outputs.mode == 'real'
        run: |
          URL="${{ secrets.OVH_TEST_URL }}"
          if [ -z "$URL" ]; then
            URL="https://nextera.payment.tn"
            echo "OVH_TEST_URL non configurée : fallback sur $URL."
          fi
          URL="${URL%/}"
          UP=0
          for i in $(seq 1 30); do
            FRONT_OK=0
            API_OK=0
            curl -sf --max-time 10 "$URL/" >/dev/null && FRONT_OK=1
            curl -sf --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' \
              "$URL/api/auth/webauthn/login/options" >/dev/null && API_OK=1
            if [ "$FRONT_OK" -eq 1 ] && [ "$API_OK" -eq 1 ]; then
              echo "TEST up (front + API identity)."
              UP=1
              break
            fi
            echo "Tentative $i/30 : front=$FRONT_OK api=$API_OK"
            sleep 10
          done
          if [ "$UP" -ne 1 ]; then
            echo "::error::Health check TEST échoué après 5 minutes ($URL)."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────
  # Publication PROD – auto sur master, ou manuelle
  # Secrets requis : OVH_PROD_HOST, OVH_PROD_USER, OVH_PROD_SSH_KEY
  # (optionnels : OVH_PROD_PORT, OVH_PROD_DIR, OVH_PROD_URL).
  # ──────────────────────────────────────────────────────────────
  deploy-prod:
    name: Publish → PROD (VM OVH)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build-images]
    # Les reviewers de cet environnement doivent être configurés dans
    # Settings > Environments > production (approbation manuelle obligatoire).
    environment: production
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    steps:
      - name: Check OVH prod config (real / fake / missing)
        id: check
        run: |
          HOST="${{ secrets.OVH_PROD_HOST }}"
          if [ -z "$HOST" ] || [ -z "${{ secrets.OVH_PROD_USER }}" ] || [ -z "${{ secrets.OVH_PROD_SSH_KEY }}" ]; then
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets OVH PROD absents : déploiement simulé."
          elif [[ "$HOST" == *.invalid ]]; then
            echo "mode=fake" >> "$GITHUB_OUTPUT"
            echo "Hôte fake détecté ($HOST) : déploiement simulé."
          else
            echo "mode=real" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup PROD database before release
        if: steps.check.outputs.mode == 'real'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_PROD_HOST }}
          username: ${{ secrets.OVH_PROD_USER }}
          key: ${{ secrets.OVH_PROD_SSH_KEY }}
          port: ${{ secrets.OVH_PROD_PORT || '22' }}
          script: |
            sudo -i <<'ROOT_EOF'
            set -e
            APP_DIR="${{ secrets.OVH_PROD_DIR || '/opt/payment-platform' }}"
            cd "$APP_DIR"
            git fetch origin
            git checkout master
            git pull origin master
            docker compose -f deploy/docker-compose.yml --profile backup up -d db-backup
            docker compose -f deploy/docker-compose.yml exec -T db-backup /scripts/backup-now.sh "pre-prod-$(date +%Y%m%d-%H%M%S)"
            chown -R "${SUDO_USER:-root}:${SUDO_USER:-root}" "$APP_DIR"
            ROOT_EOF

      - name: Deploy to OVH prod VM
        if: steps.check.outputs.mode == 'real'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OVH_PROD_HOST }}
          username: ${{ secrets.OVH_PROD_USER }}
          key: ${{ secrets.OVH_PROD_SSH_KEY }}
          port: ${{ secrets.OVH_PROD_PORT || '22' }}
          script: |
            sudo -i <<'ROOT_EOF'
            set -e
            APP_DIR="${{ secrets.OVH_PROD_DIR || '/opt/payment-platform' }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "${{ github.server_url }}/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout --detach "${{ github.sha }}"
            export IMAGE_TAG="${{ needs.build-images.outputs.sha_tag }}"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml --profile backup up -d
            docker compose -f deploy/docker-compose.yml ps
            docker image prune -f
            docker builder prune -af
            chown -R "${SUDO_USER:-root}:${SUDO_USER:-root}" "$APP_DIR"
            ROOT_EOF

      - name: Fake deploy PROD (simulation, run vert)
        if: steps.check.outputs.mode != 'real'
        run: |
          echo "=============================================="
          echo " FAKE deploy PROD (mode: ${{ steps.check.outputs.mode }})"
          echo " Branche : master"
          echo " Hote    : ${{ secrets.OVH_PROD_HOST || 'vm-prod.invalid (non defini)' }}"
          echo " Simule (root) : backup pre-prod + git pull + pull GHCR + up -d + prune"
          echo "=============================================="

      - name: Health check PROD (si URL configurée)
        run: |
          if [ -z "${{ secrets.OVH_PROD_URL }}" ]; then
            echo "OVH_PROD_URL non configurée : health check ignoré."
            exit 0
          fi
          UP=0
          for i in $(seq 1 30); do
            if curl -sf "${{ secrets.OVH_PROD_URL }}/actuator/health"; then echo "PROD up"; UP=1; break; fi
            sleep 10
          done
          if [ "$UP" -ne 1 ]; then
            echo "::error::Health check PROD échoué après 5 minutes."
            exit 1
          fi
