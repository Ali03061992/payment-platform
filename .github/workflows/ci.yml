name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26-ea'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        working-directory: backend

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: backend/*/target/*.jar
          retention-days: 3

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular app
        run: npx ng build --configuration production
        working-directory: frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend images
        working-directory: backend
        run: |
          for service in identity-service organization-service payment-service notification-service api-gateway; do
            docker build -t payment-platform/$service:latest \
              --build-arg SERVICE_NAME=$service .
          done

      - name: Build frontend image
        working-directory: .
        run: docker build -t payment-platform/angular:latest -f frontend/Dockerfile .

      - name: Save Docker images
        run: |
          docker save payment-platform/{identity-service,organization-service,payment-service,notification-service,api-gateway,angular}:latest \
            | gzip > docker-images.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: docker-images.tar.gz
          retention-days: 3

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: payment-platform-ui/package-lock.json

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker images
        run: docker load < docker-images.tar.gz

      - name: Install Cypress
        working-directory: payment-platform-ui
        run: npm ci

      - name: Start services
        working-directory: .
        run: docker compose -f deploy/docker-compose.yml up -d --wait
        env:
          MYSQL_ROOT_PASSWORD: test_root_pw
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRATION: 86400000
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          RATE_LIMIT_PER_MINUTE: 100
          INTERNAL_SECRET: test-internal-secret

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 && break || sleep 2
          done

      - name: Run Cypress tests
        working-directory: payment-platform-ui
        run: npx cypress run

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose -f deploy/docker-compose.yml down -v
