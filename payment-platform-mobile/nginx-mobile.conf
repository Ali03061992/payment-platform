server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DEV UNIQUEMENT : proxy same-origin vers la gateway de l'hote.
  # Evite tout CORS (le navigateur reste sur :8087) sans toucher au backend.
  # X-Forwarded-For force = la whitelist IP gateway n'accepte que 127.0.0.1
  # et lit ce header en priorite (IpWhitelistFilter.getClientIp).
  location /api/ {
    proxy_pass http://host.docker.internal:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For 127.0.0.1;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
