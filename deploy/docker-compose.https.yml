# Override HTTPS pour les VMs OVH (TEST + PROD) :
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml up -d
# - nginx passe en 443 TLS (conf default-ssl.conf) + 80 -> redirection 301.
# - Certificats TLS deja presents sur la VM : NGINX_CERTS_DIR (deploy/.env) doit
#   pointer vers le dossier contenant fullchain.pem et privkey.pem.
#   Sans cette variable, ./nginx/certs (relatif a deploy/) est utilise.
# - Les origines applicatives doivent passer en https :
#   CORS_ALLOWED_ORIGINS, WEBAUTHN_ALLOWED_ORIGINS, FRONTEND_URL.
# Ne pas utiliser ce fichier en local (dev/e2e restent en http://localhost:8080).

services:
  angular:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
