# IP cliente réelle : le nginx hôte pose X-Real-IP, sinon on prend la connexion.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# Schéma d'origine conservé à travers le nginx hôte (TLS terminé sur l'hôte).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Re-résolution DNS Docker à chaud : les conteneurs recréés changent d'IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api-gateway:8081;
    set $sse_upstream notification-service:8085;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/rss+xml
        image/svg+xml;

    # Fichiers de configuration PWA : jamais de cache long.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /ngsw.json {
        expires -1;
        try_files $uri =404;
    }

    location = /ngsw-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /assets/env.js {
        expires -1;
        try_files $uri =404;
    }

    # Cache static assets (hors fichiers PWA/config ci-dessus).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SSE proxy - bypass gateway to avoid thread exhaustion
    location /api/notifications/stream {
        proxy_pass http://$sse_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
