# Render Blueprint - Free plan compatible (tout en `type: web`, pas de `pserv` privé)
# `pserv` nécessite un plan payant -> en Free, on met MySQL/Redis/RabbitMQ/ES en `web` (public mais gratuit)
# Alternative : remplacer par services managés externes (Neon, Upstash, CloudAMQP) et retirer ces 4 blocs

services:
  # --- Infra: MySQL 8.4 ---
  - type: web
    name: payment-platform-mysql
    env: docker
    image:
      url: mysql:8.4
    plan: free
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_USER
        value: payment_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: payment_platform

  # --- Infra: Redis ---
  - type: web
    name: payment-platform-redis
    env: docker
    image:
      url: redis:7-alpine
    plan: free

  # --- Infra: RabbitMQ ---
  - type: web
    name: payment-platform-rabbitmq
    env: docker
    image:
      url: rabbitmq:4-management
    plan: free
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: payment
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # --- Backend: Identity ---
  - type: web
    name: payment-platform-identity
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: identity-service
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 30m
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MYSQL_HOST
        fromService:
          name: payment-platform-mysql
          type: web
          property: host
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_USER
        fromService:
          name: payment-platform-mysql
          type: web
          envVarKey: MYSQL_USER
      - key: MYSQL_PASSWORD
        fromService:
          name: payment-platform-mysql
          type: web
          envVarKey: MYSQL_PASSWORD
      - key: RABBITMQ_HOST
        fromService:
          name: payment-platform-rabbitmq
          type: web
          property: host
      - key: REDIS_HOST
        fromService:
          name: payment-platform-redis
          type: web
          property: host
      - key: INTERNAL_SECRET
        generateValue: true

  # --- Backend: Organization ---
  - type: web
    name: payment-platform-organization
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: organization-service
      - key: JWT_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: JWT_SECRET
      - key: MYSQL_HOST
        fromService:
          name: payment-platform-mysql
          type: web
          property: host
      - key: RABBITMQ_HOST
        fromService:
          name: payment-platform-rabbitmq
          type: web
          property: host
      - key: REDIS_HOST
        fromService:
          name: payment-platform-redis
          type: web
          property: host
      - key: INTERNAL_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: INTERNAL_SECRET

  # --- Backend: Payment ---
  - type: web
    name: payment-platform-payment
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: payment-service
      - key: JWT_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: JWT_SECRET
      - key: MYSQL_HOST
        fromService:
          name: payment-platform-mysql
          type: web
          property: host
      - key: RABBITMQ_HOST
        fromService:
          name: payment-platform-rabbitmq
          type: web
          property: host
      - key: REDIS_HOST
        fromService:
          name: payment-platform-redis
          type: web
          property: host
      - key: INTERNAL_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: INTERNAL_SECRET

  # --- Backend: Notification ---
  - type: web
    name: payment-platform-notification
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: notification-service
      - key: JWT_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: JWT_SECRET
      - key: MYSQL_HOST
        fromService:
          name: payment-platform-mysql
          type: web
          property: host
      - key: RABBITMQ_HOST
        fromService:
          name: payment-platform-rabbitmq
          type: web
          property: host

  # --- Backend: API Gateway (exposé) ---
  - type: web
    name: payment-platform-gateway
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: api-gateway
      - key: JWT_SECRET
        fromService:
          name: payment-platform-identity
          type: web
          envVarKey: JWT_SECRET
      - key: JWT_EXPIRATION
        value: 30m
      - key: CORS_ALLOWED_ORIGINS
        value: https://payment-platform-frontend.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: 100
      - key: IDENTITY_SERVICE_URL
        fromService:
          name: payment-platform-identity
          type: web
          property: host
      - key: ORGANIZATION_SERVICE_URL
        fromService:
          name: payment-platform-organization
          type: web
          property: host
      - key: PAYMENT_SERVICE_URL
        fromService:
          name: payment-platform-payment
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: payment-platform-notification
          type: web
          property: host

  # --- Frontend Angular (exposé) ---
  - type: web
    name: payment-platform-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://payment-platform-gateway.onrender.com
