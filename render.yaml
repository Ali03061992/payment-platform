services:
  # --- API Gateway ---
  - type: web
    name: payment-platform-gateway
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: java -jar app.jar
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: api-gateway
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 30m
      - key: CORS_ALLOWED_ORIGINS
        value: https://payment-platform.onrender.com
      - key: RATE_LIMIT_PER_MINUTE
        value: 100

  # --- Identity Service ---
  - type: web
    name: payment-platform-identity
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: identity-service
      - key: JWT_SECRET
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false

  # --- Organization Service ---
  - type: web
    name: payment-platform-organization
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: organization-service
      - key: JWT_SECRET
        sync: false

  # --- Payment Service ---
  - type: web
    name: payment-platform-payment
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: payment-service
      - key: JWT_SECRET
        sync: false

  # --- Notification Service ---
  - type: web
    name: payment-platform-notification
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVICE_NAME
        value: notification-service
      - key: JWT_SECRET
        sync: false

  # --- Frontend (Angular) ---
  - type: web
    name: payment-platform-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: starter
    routes:
      - type: rewrite
        source: /api/*
        destination: https://payment-platform-gateway.onrender.com/api/*
