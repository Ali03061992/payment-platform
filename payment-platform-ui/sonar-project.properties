# SonarQube / SonarCloud – Frontend seul (payment-platform-ui)
# Utilisé quand on scanne le frontend en projet séparé :  cd payment-platform-ui && sonar-scanner
sonar.projectKey=payment-platform-frontend
sonar.projectName=Payment Platform :: Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.host.url=http://localhost:9000
# sonar.organization=<votre-organisation-sonarcloud>
# sonar.token via env SONAR_TOKEN

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  **/assets/**,\
  **/environments/**

sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/main.ts,\
  **/*.spec.ts,\
  **/environments/**,\
  **/assets/**

# LCOV généré par `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/payment-platform-ui/lcov.info,coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/payment-platform-ui/lcov.info,coverage/lcov.info
sonar.javascript.environments=amd, browser

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.scm.provider=git
