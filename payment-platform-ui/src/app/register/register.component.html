<div class="register-container">
  <div class="register-card">
    <h1>Créer un compte</h1>
    <p class="subtitle">Rejoignez la plateforme de paiement</p>

    @if (success) {
      <div class="success-message">
        <h2>Inscription réussie !</h2>
        <p>Votre compte a été créé avec succès.</p>
        <a routerLink="/login" class="btn btn-primary">Se connecter</a>
      </div>
    }

    @if (!success) {
      <form (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input id="lastName" type="text" [(ngModel)]="form.lastName" name="lastName" required placeholder="Dupont" aria-required="true">
          </div>
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input id="firstName" type="text" [(ngModel)]="form.firstName" name="firstName" required placeholder="Jean" aria-required="true">
          </div>
        </div>
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input id="username" type="text" [(ngModel)]="form.username" name="username" required placeholder="jean.dupont" aria-required="true">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="form.email" name="email" required placeholder="jean@exemple.com" aria-required="true">
        </div>
        <div class="form-group">
          <label for="phone">Téléphone (optionnel)</label>
          <div class="phone-input">
            <span class="phone-prefix">+216</span>
            <input id="phone" type="tel" [(ngModel)]="form.phone" name="phone" placeholder="XX XXX XXX" class="phone-field">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" [(ngModel)]="form.password" name="password" required minlength="8" placeholder="Minimum 8 caractères" aria-required="true">
        </div>
        <div class="form-group">
          <label for="role">Rôle</label>
          <select id="role" [(ngModel)]="form.role" name="role" required aria-required="true">
            @for (r of roles; track r) {
              <option [value]="r.value">{{ r.label }}</option>
            }
          </select>
        </div>
        @if (error) {
          <div class="error-message" role="alert" aria-live="assertive">{{ error }}</div>
        }
        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading"
          [attr.aria-label]="loading ? 'Inscription en cours...' : 'S\'inscrire'">
          {{ loading ? 'Inscription en cours...' : 'S\'inscrire' }}
        </button>
      </form>
    }

    <p class="login-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
