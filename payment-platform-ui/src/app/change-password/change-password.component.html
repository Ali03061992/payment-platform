<div class="change-password-container">
  @if (!submitted) {
    <div class="change-password-card">
      <h2>{{ 'CHANGE_PASSWORD.TITLE' | translate }}</h2>
      <p class="subtitle">{{ 'CHANGE_PASSWORD.SUBTITLE' | translate }}</p>
      @if (error) {
        <div class="error-message">{{ error }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="currentPassword">{{ 'CHANGE_PASSWORD.CURRENT_PASSWORD' | translate }}</label>
          <input
            id="currentPassword"
            type="password"
            [(ngModel)]="currentPassword"
            name="currentPassword"
            [placeholder]="'CHANGE_PASSWORD.CURRENT_PASSWORD' | translate"
            required
            aria-required="true"
            />
        </div>
        <div class="form-group">
          <label for="newPassword">{{ 'CHANGE_PASSWORD.NEW_PASSWORD' | translate }}</label>
          <input
            id="newPassword"
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            [placeholder]="'CHANGE_PASSWORD.NEW_PASSWORD_PLACEHOLDER' | translate"
            required
            aria-required="true"
            />
        </div>
        <div class="form-group">
          <label for="confirmPassword">{{ 'CHANGE_PASSWORD.CONFIRM_PASSWORD' | translate }}</label>
          <input
            id="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [placeholder]="'CHANGE_PASSWORD.CONFIRM_PLACEHOLDER' | translate"
            required
            aria-required="true"
            />
        </div>
        <button type="submit" class="submit-btn" [disabled]="loading"
          [attr.aria-label]="loading ? ('CHANGE_PASSWORD.SUBMIT_LOADING' | translate) : ('CHANGE_PASSWORD.SUBMIT_BUTTON' | translate)">
          {{ loading ? ('CHANGE_PASSWORD.SUBMIT_LOADING' | translate) : ('CHANGE_PASSWORD.SUBMIT_BUTTON' | translate) }}
        </button>
      </form>
    </div>
  }

  @if (submitted) {
    <div class="change-password-card success">
      <div class="success-icon"><app-icon name="check-circle" [size]="40"></app-icon></div>
      <h2>{{ 'CHANGE_PASSWORD.SUCCESS_TITLE' | translate }}</h2>
      <p>{{ 'CHANGE_PASSWORD.SUCCESS_MSG' | translate }}</p>
      <button class="submit-btn" (click)="goToDashboard()" [attr.aria-label]="'CHANGE_PASSWORD.BACK_TO_DASHBOARD' | translate">{{ 'CHANGE_PASSWORD.BACK_TO_DASHBOARD' | translate }}</button>
    </div>
  }
</div>
