<div class="change-password-container">
  @if (!submitted) {
    <div class="change-password-card">
      <h2>Modifier le mot de passe</h2>
      <p class="subtitle">Entrez votre mot de passe actuel et le nouveau mot de passe</p>
      @if (error) {
        <div class="error-message">{{ error }}</div>
      }
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="currentPassword">Mot de passe actuel</label>
          <input
            id="currentPassword"
            type="password"
            [(ngModel)]="currentPassword"
            name="currentPassword"
            placeholder="Mot de passe actuel"
            required
            />
        </div>
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <input
            id="newPassword"
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Nouveau mot de passe (min. 8 caractères)"
            required
            />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input
            id="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirmer le nouveau mot de passe"
            required
            />
        </div>
        <button type="submit" class="submit-btn" [disabled]="loading">
          {{ loading ? 'Enregistrement...' : 'Modifier le mot de passe' }}
        </button>
      </form>
    </div>
  }

  @if (submitted) {
    <div class="change-password-card success">
      <div class="success-icon">✅</div>
      <h2>Mot de passe modifié</h2>
      <p>Votre mot de passe a été modifié avec succès.</p>
      <button class="submit-btn" (click)="goToDashboard()">Retour au tableau de bord</button>
    </div>
  }
</div>
