<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/icon-app.png" class="logo-img" alt="Payment Platform">
    </div>
    <h1>Connexion</h1>
    <p class="subtitle">Accédez à votre espace</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" type="text" [(ngModel)]="form.username" name="username" required placeholder="system.admin" autocomplete="username" aria-required="true">
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" [(ngModel)]="form.password" name="password" required placeholder="••••••••" autocomplete="current-password" aria-required="true">
      </div>

      @if (error) {
        <div class="error-message" role="alert" aria-live="assertive">{{ error }}</div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading"
        [attr.aria-label]="loading ? 'Connexion en cours...' : 'Se connecter'">
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="register-link">
      Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
    </p>
  </div>
</div>
