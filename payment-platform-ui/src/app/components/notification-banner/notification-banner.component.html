@if (showBanner) {
  <div class="notification-banner" role="alert" [attr.aria-label]="'BANNER.BANNER_ARIA' | translate">
    <div class="banner-content">
      <div class="banner-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </div>
      <div class="banner-text">
        <strong>{{ 'BANNER.TITLE' | translate }}</strong>
        <span>{{ 'BANNER.TEXT' | translate }}</span>
      </div>
      <div class="banner-actions">
        <button class="banner-btn banner-btn-accept" (click)="acceptNotifications()" [attr.aria-label]="'BANNER.ACCEPT_ARIA' | translate">{{ 'BANNER.ACCEPT' | translate }}</button>
        <button class="banner-btn banner-btn-dismiss" (click)="dismissNotifications()" [attr.aria-label]="'BANNER.LATER_ARIA' | translate">{{ 'BANNER.LATER' | translate }}</button>
      </div>
    </div>
  </div>
}
