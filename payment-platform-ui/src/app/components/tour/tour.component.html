@if (isActive) {
  <div class="tour-overlay" aria-hidden="true"></div>
  @if (showHighlight) {
    <div class="tour-highlight" aria-hidden="true"
      [style.top.px]="highlightPosition.top"
      [style.left.px]="highlightPosition.left"
      [style.width.px]="highlightPosition.width"
      [style.height.px]="highlightPosition.height">
    </div>
  }

  <div
    class="tour-tooltip"
    [style.top.px]="tooltipPosition.top"
    [style.left.px]="tooltipPosition.left"
    [class.center-tooltip]="!showHighlight"
    [class.above]="showHighlight && tooltipPosition.top < highlightPosition.top"
    [class.below]="showHighlight && tooltipPosition.top >= highlightPosition.top"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'tour-title-' + currentStep"
    [attr.aria-label]="'TOUR.GUIDE_ARIA' | translate">

    <div class="tour-tooltip-header">
      <div class="tour-step-icon" aria-hidden="true"><app-icon [name]="steps[currentStep].icon" [size]="24"></app-icon></div>
      <div class="tour-step-counter">{{ 'TOUR.STEP_OF' | translate:{current: currentStep + 1, total: steps.length} }}</div>
    </div>

    <div class="tour-progress-bar">
      <div class="tour-progress-fill" [style.width.%]="progressPercent"></div>
    </div>

    <h3 class="tour-tooltip-title" [id]="'tour-title-' + currentStep">{{ steps[currentStep].title }}</h3>
    <p class="tour-tooltip-description">{{ steps[currentStep].description }}</p>

    <div class="tour-tooltip-actions">
      <button class="tour-btn tour-btn-skip" (click)="skipTour()" [attr.aria-label]="'TOUR.SKIP_ARIA' | translate">{{ 'TOUR.SKIP' | translate }}</button>
      <div class="tour-btn-group">
        @if (!isFirstStep) {
          <button class="tour-btn tour-btn-prev" (click)="prevStep()" [attr.aria-label]="'TOUR.PREV_ARIA' | translate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            {{ 'TOUR.PREV' | translate }}
          </button>
        }
        <button class="tour-btn tour-btn-next" (click)="nextStep()"
          [attr.aria-label]="isLastStep ? ('TOUR.FINISH_ARIA' | translate) : ('TOUR.NEXT_ARIA' | translate)">
          {{ isLastStep ? ('TOUR.FINISH' | translate) : ('TOUR.NEXT' | translate) }}
          @if (!isLastStep) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="tour-step-dots" aria-hidden="true">
      @for (step of steps; track $index) {
        <span class="tour-dot" [class.active]="$index === currentStep"></span>
      }
    </div>
    <button class="tour-btn tour-btn-notagain" (click)="completeTour()">{{ 'TOUR.DONT_SHOW' | translate }}</button>
  </div>
}
