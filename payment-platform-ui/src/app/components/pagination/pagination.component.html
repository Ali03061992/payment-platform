@if (totalElements > 0) {
  <nav class="pagination" [attr.aria-label]="'PAGINATION.NAV_ARIA' | translate">
    <button type="button" class="btn btn-sm btn-secondary" (click)="prev()" [disabled]="!canPrev"
      aria-label="Page précédente">{{ 'PAGINATION.PREV' | translate }}</button>
    @for (p of pageNumbers; track p) {
      <button type="button" class="btn btn-sm page-num" [class.active]="p === page"
        [class.btn-primary]="p === page" [class.btn-secondary]="p !== page"
        (click)="goTo(p)" [attr.aria-label]="('PAGINATION.GOTO_ARIA' | translate:{page: p + 1})"
        [attr.aria-current]="p === page ? 'page' : null">{{ p + 1 }}</button>
    }
    <button type="button" class="btn btn-sm btn-secondary" (click)="next()" [disabled]="!canNext"
      aria-label="Page suivante">{{ 'PAGINATION.NEXT' | translate }}</button>
    <span class="pagination-info" aria-live="polite">{{ 'PAGINATION.INFO' | translate:{from: from, to: to, total: totalElements} }}</span>
    @if (showSize) {
      <label class="pagination-size">
        <span>{{ 'PAGINATION.SIZE_LABEL' | translate }}</span>
        <select [ngModel]="size" (ngModelChange)="onSizeChange($event)" class="form-control"
          [attr.aria-label]="'PAGINATION.SIZE_ARIA' | translate">
          @for (s of pageSizes; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
    }
  </nav>
}
