<div class="export-page">
  <div class="page-header">
    <h2>{{ 'PAYMENT_EXPORT.TITLE' | translate }}</h2>
  </div>

  <div class="export-card">
    <h3>{{ 'PAYMENT_EXPORT.CSV_TITLE' | translate }}</h3>
    <p>{{ 'PAYMENT_EXPORT.PERIOD_HINT' | translate }}</p>

    <div class="date-row">
      <div class="field">
        <label for="from">{{ 'PAYMENT_EXPORT.FROM' | translate }}</label>
        <input id="from" type="date" [(ngModel)]="from" />
      </div>
      <div class="field">
        <label for="to">{{ 'PAYMENT_EXPORT.TO' | translate }}</label>
        <input id="to" type="date" [(ngModel)]="to" />
      </div>
    </div>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <div class="actions">
      <button class="btn btn-primary" (click)="exportCsv()" [disabled]="loading">
        @if (!loading) {
          <span class="btn-icon-text"><app-icon name="download" [size]="18"></app-icon> {{ 'PAYMENT_EXPORT.DOWNLOAD' | translate }}</span>
        }
        @if (loading) {
          <span>{{ 'PAYMENT_EXPORT.EXPORTING' | translate }}</span>
        }
      </button>
    </div>
  </div>
</div>
