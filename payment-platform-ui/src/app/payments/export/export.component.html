<div class="export-page">
  <div class="page-header">
    <h2>Export des paiements</h2>
  </div>

  <div class="export-card">
    <h3>Exporter en CSV</h3>
    <p>Sélectionnez la période à exporter.</p>

    <div class="date-row">
      <div class="field">
        <label for="from">Du</label>
        <input id="from" type="date" [(ngModel)]="from" />
      </div>
      <div class="field">
        <label for="to">Au</label>
        <input id="to" type="date" [(ngModel)]="to" />
      </div>
    </div>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <div class="actions">
      <button class="btn btn-primary" (click)="exportCsv()" [disabled]="loading">
        @if (!loading) {
          <span>📥 Télécharger CSV</span>
        }
        @if (loading) {
          <span>Export en cours...</span>
        }
      </button>
    </div>
  </div>
</div>
