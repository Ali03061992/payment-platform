<div class="page-header">
  <h2>Nouveau paiement</h2>
</div>

<div class="form-card">
  <form (ngSubmit)="create()">
    <div class="form-row">
      <div class="form-group">
        <label for="shopSelect">Boutique</label>
        <select [(ngModel)]="shopId" name="shop" id="shopSelect" class="form-control" required aria-required="true">
          <option [value]="0">-- Sélectionner --</option>
          @for (s of shops; track s) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="supplierSelect">Fournisseur</label>
        <select [(ngModel)]="supplierId" name="supplier" id="supplierSelect" class="form-control" required aria-required="true">
          <option [value]="0">-- Sélectionner --</option>
          @for (s of suppliers; track s) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="amountInput">Montant</label>
        <input type="number" [(ngModel)]="amount" name="amount" id="amountInput" class="form-control"
          min="0.01" max="999999.99" step="0.01" placeholder="0.00" required aria-required="true">
      </div>
      <div class="form-group">
        <label for="currencySelect">Devise</label>
        <select [(ngModel)]="currency" name="currency" id="currencySelect" class="form-control">
          <option value="TND">TND</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" type="button" routerLink="/dashboard/payments" aria-label="Annuler la création de paiement">Annuler</button>
      <button class="btn btn-primary" [disabled]="creating || !shopId || !supplierId || amount < 0.01 || amount > 999999.99"
        [attr.aria-label]="creating ? 'Création en cours...' : 'Créer le paiement'">
        {{ creating ? 'Création...' : 'Créer le paiement' }}
      </button>
    </div>
  </form>
</div>
