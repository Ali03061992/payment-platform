<div class="page-header">
  <h2>{{ 'PAYMENT_CREATE.TITLE' | translate }}</h2>
</div>

<div class="form-card">
  <form (ngSubmit)="create()">
    <div class="form-row">
      <div class="form-group">
        <label for="shopSelect">{{ 'PAYMENTS.SHOP' | translate }}</label>
        <select [(ngModel)]="shopId" name="shop" id="shopSelect" class="form-control" required aria-required="true">
          <option [value]="0">{{ 'PAYMENT_CREATE.SELECT_OPTION' | translate }}</option>
          @for (s of shops; track s) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label for="supplierSelect">{{ 'PAYMENTS.SUPPLIER' | translate }}</label>
        <select [(ngModel)]="supplierId" name="supplier" id="supplierSelect" class="form-control" required aria-required="true">
          <option [value]="0">{{ 'PAYMENT_CREATE.SELECT_OPTION' | translate }}</option>
          @for (s of suppliers; track s) {
            <option [value]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="amountInput">{{ 'PAYMENTS.AMOUNT' | translate }}</label>
        <input type="number" [(ngModel)]="amount" name="amount" id="amountInput" class="form-control"
          min="0.01" max="999999.99" step="0.01" placeholder="0.00" required aria-required="true">
      </div>
      <div class="form-group">
        <label for="currencySelect">{{ 'PAYMENT_CREATE.CURRENCY' | translate }}</label>
        <select [(ngModel)]="currency" name="currency" id="currencySelect" class="form-control">
          <option value="TND">TND</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" type="button" routerLink="/dashboard/payments" [attr.aria-label]="'PAYMENT_CREATE.CANCEL_ARIA' | translate">{{ 'PAYMENTS.CANCEL_BTN' | translate }}</button>
      <button class="btn btn-primary" [disabled]="creating || !shopId || !supplierId || amount < 0.01 || amount > 999999.99"
        [attr.aria-label]="creating ? ('PAYMENT_CREATE.SUBMITTING' | translate) : ('PAYMENT_CREATE.SUBMIT' | translate)">
        {{ creating ? ('PAYMENT_CREATE.SUBMITTING' | translate) : ('PAYMENT_CREATE.SUBMIT' | translate) }}
      </button>
    </div>
  </form>
</div>
