<div class="page-header">
  <h2>Nouveau paiement</h2>
</div>

<div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

<div class="form-card">
  <form (ngSubmit)="create()">
    <div class="form-row">
      <div class="form-group">
        <label>Boutique</label>
        <select [(ngModel)]="shopId" name="shop" class="form-control" required>
          <option [value]="0">-- Sélectionner --</option>
          <option *ngFor="let s of shops" [value]="s.id">{{ s.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fournisseur</label>
        <select [(ngModel)]="supplierId" name="supplier" class="form-control" required>
          <option [value]="0">-- Sélectionner --</option>
          <option *ngFor="let s of suppliers" [value]="s.id">{{ s.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Montant</label>
        <input type="number" [(ngModel)]="amount" name="amount" class="form-control"
               min="0.01" step="0.01" placeholder="0.00" required>
      </div>
      <div class="form-group">
        <label>Devise</label>
        <select [(ngModel)]="currency" name="currency" class="form-control">
          <option value="TND">TND</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" type="button" routerLink="/dashboard/payments">Annuler</button>
      <button class="btn btn-primary" [disabled]="creating || !shopId || !supplierId || amount <= 0">
        {{ creating ? 'Création...' : 'Créer le paiement' }}
      </button>
    </div>
  </form>
</div>
