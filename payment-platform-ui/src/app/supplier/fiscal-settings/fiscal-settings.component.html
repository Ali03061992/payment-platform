@if (loading) {
  <div class="loading"><div class="spinner"></div><span>{{ 'FISCAL_SETTINGS.LOADING' | translate }}</span></div>
}
@if (!loading) {
  <div class="page-header">
    <h2>{{ 'FISCAL_SETTINGS.TITLE' | translate }}</h2>
  </div>
  <div class="form-card">
    @if (supplierName) {
      <p class="text-placeholder">{{ supplierName }}</p>
    }
    <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
      <input id="teifEnabled" type="checkbox" [(ngModel)]="teifEnabled">
      <label for="teifEnabled">
        <strong>{{ 'FISCAL_SETTINGS.TEIF' | translate }}</strong><br>
        <span class="field-hint">{{ 'FISCAL_SETTINGS.TEIF_HINT' | translate }}</span>
      </label>
    </div>
    <div class="form-group" style="display:flex;align-items:flex-start;gap:10px;">
      <input id="tejEnabled" type="checkbox" [(ngModel)]="tejEnabled">
      <label for="tejEnabled">
        <strong>{{ 'FISCAL_SETTINGS.TEJ' | translate }}</strong><br>
        <span class="field-hint">{{ 'FISCAL_SETTINGS.TEJ_HINT' | translate }}</span>
      </label>
    </div>
    <div class="info-box">
      {{ 'FISCAL_SETTINGS.INFO' | translate }}
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" [disabled]="saving" (click)="save()">
        {{ saving ? ('COMMON.SAVING' | translate) : ('COMMON.SAVE' | translate) }}
      </button>
    </div>
  </div>
}
