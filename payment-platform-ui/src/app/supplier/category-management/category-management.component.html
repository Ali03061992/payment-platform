<div class="page-header">
  <h1>Categories</h1>
  <button class="btn btn-primary" (click)="openCreate()">+ Nouvelle categorie</button>
</div>

@if (showForm) {
  <div class="form-card">
    <h3>Creer une categorie</h3>
    <form (ngSubmit)="save()">
      <div class="form-row">
        <div class="form-group">
          <label>Nom <span class="required">*</span></label>
          <input type="text" [(ngModel)]="form.name" name="name" class="form-control" placeholder="Ex: Vetements" required>
        </div>
        <div class="form-group">
          <label>Code <span class="required">*</span></label>
          <input type="text" [(ngModel)]="form.code" name="code" class="form-control" placeholder="Ex: VET" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="showForm = false">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving || !form.name || !form.code">
          {{ saving ? 'Creation...' : 'Creer' }}
        </button>
      </div>
    </form>
  </div>
}

@if (loading) {
  <div class="loading">
    <div class="spinner"></div>
  </div>
}

@if (!loading) {
  <div class="table-card">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Code</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (cat of categories; track cat) {
            <tr>
              <td><strong>{{ cat.name }}</strong></td>
              <td><code>{{ cat.code }}</code></td>
              <td><span class="badge badge-active">{{ cat.status }}</span></td>
              <td>
                <button class="btn btn-sm btn-danger" (click)="deleteCategory(cat)">Supprimer</button>
              </td>
            </tr>
          }
          @if (categories.length === 0) {
            <tr>
              <td colspan="4" class="empty">Aucune categorie</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
}
