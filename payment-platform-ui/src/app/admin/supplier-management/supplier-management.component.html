<div class="page-header">
  <h2>Fournisseurs</h2>
  <button class="btn btn-primary" (click)="showCreate = !showCreate">
    {{ showCreate ? 'Annuler' : '+ Nouveau fournisseur' }}
  </button>
</div>

<div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>
<div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

<div class="form-card" *ngIf="showCreate" style="margin-bottom: 24px;">
  <h3 style="margin-bottom: 16px;">Créer un fournisseur</h3>
  <form (ngSubmit)="create()">
    <div class="form-group">
      <label>Nom du fournisseur</label>
      <input type="text" [(ngModel)]="newName" name="name" class="form-control"
             placeholder="Ex: Fournisseur ABC" required>
    </div>
    <button class="btn btn-primary" [disabled]="creating || !newName.trim()">
      {{ creating ? 'Création...' : 'Créer' }}
    </button>
  </form>
</div>

<div class="loading" *ngIf="loading">
  <div class="spinner"></div>
  <span>Chargement...</span>
</div>

<div class="table-card" *ngIf="!loading">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Statut</th>
          <th>Créé le</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of suppliers">
          <td>{{ s.id }}</td>
          <td><strong>{{ s.name }}</strong></td>
          <td>
            <span class="status-badge" [class.active]="s.status === 'ACTIVE'" [class.disabled]="s.status === 'DISABLED'">
              {{ s.status === 'ACTIVE' ? 'Actif' : 'Désactivé' }}
            </span>
          </td>
          <td>{{ s.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>
            <button class="btn btn-sm" [class.btn-success]="s.status === 'DISABLED'" [class.btn-danger]="s.status === 'ACTIVE'"
                    (click)="toggle(s)">
              {{ s.status === 'ACTIVE' ? 'Désactiver' : 'Activer' }}
            </button>
          </td>
        </tr>
        <tr *ngIf="suppliers.length === 0">
          <td colspan="5" style="text-align:center;color:#8896ab;padding:32px;">Aucun fournisseur trouvé</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
