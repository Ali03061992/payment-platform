<div class="page-header">
  <h2>{{ 'ORGS.STATS_TITLE' | translate }}</h2>
</div>

@if (loading) {
  <div class="loading">
    <div class="spinner"></div>
    <span>{{ 'COMMON.LOADING' | translate }}</span>
  </div>
}

@if (stats) {
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value">{{ stats.suppliers }}</div>
      <div class="stat-label">{{ 'DASHBOARD.SUPPLIERS' | translate }}</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.shops }}</div>
      <div class="stat-label">{{ 'DASHBOARD.SHOPS' | translate }}</div>
    </div>
  </div>
}
