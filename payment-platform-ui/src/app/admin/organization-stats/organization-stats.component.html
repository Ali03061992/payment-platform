<div class="page-header">
  <h2>Statistiques des organisations</h2>
</div>

@if (loading) {
  <div class="loading">
    <div class="spinner"></div>
    <span>Chargement...</span>
  </div>
}

@if (stats) {
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value">{{ stats.suppliers }}</div>
      <div class="stat-label">Fournisseurs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ stats.shops }}</div>
      <div class="stat-label">Boutiques</div>
    </div>
  </div>
}
