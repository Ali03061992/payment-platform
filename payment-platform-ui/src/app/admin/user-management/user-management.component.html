<div class="page-header">
  <h1>Gestion des utilisateurs</h1>
  <a routerLink="create" class="btn btn-primary">+ Créer un compte</a>
</div>

<div class="filters">
  <select [(ngModel)]="filterRole" (change)="applyFilter()">
    <option value="">Tous les rôles</option>
    <option value="SYSTEM_ADMIN">SYSTEM_ADMIN</option>
    <option value="SUPPLIER_ADMIN">SUPPLIER_ADMIN</option>
    <option value="SUPPLIER_AGENT">SUPPLIER_AGENT</option>
    <option value="SHOP_ADMIN">SHOP_ADMIN</option>
    <option value="SHOP_AGENT">SHOP_AGENT</option>
  </select>
  <select [(ngModel)]="filterStatus" (change)="applyFilter()">
    <option value="">Tous les statuts</option>
    <option value="ACTIVE">Actif</option>
    <option value="DISABLED">Désactivé</option>
  </select>
</div>

<div *ngIf="loading" class="loading">
  <div class="spinner"></div>
  <span>Chargement...</span>
</div>

<div class="table-card" *ngIf="!loading">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nom d'utilisateur</th>
          <th>Nom complet</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td><strong>{{ user.username }}</strong></td>
          <td>{{ user.firstName }} {{ user.lastName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone || '-' }}</td>
          <td><span class="role-badge">{{ user.roles[0] }}</span></td>
          <td>
            <span class="status-badge" [class.active]="user.status === 'ACTIVE'" [class.disabled]="user.status === 'DISABLED'">
              {{ user.status }}
            </span>
          </td>
          <td class="actions">
            <button *ngIf="user.status === 'ACTIVE'" class="btn btn-sm btn-danger" (click)="disable(user)">Désactiver</button>
            <button *ngIf="user.status === 'DISABLED'" class="btn btn-sm btn-success" (click)="activate(user)">Activer</button>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="7" class="empty">Aucun utilisateur trouvé</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
