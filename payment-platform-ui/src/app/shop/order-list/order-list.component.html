<div class="page-header">
  <h2>Commandes</h2>
  <button class="btn btn-primary" routerLink="/dashboard/shop/orders/create">+ Nouvelle commande</button>
</div>

<div class="alert alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

<div class="filters" *ngIf="!loading">
  <select [(ngModel)]="filterStatus" class="form-control" style="max-width:200px;">
    <option value="">Tous les statuts</option>
    <option value="DRAFT">Brouillon</option>
    <option value="PENDING">En attente</option>
    <option value="CONFIRMED">Confirmé</option>
    <option value="PREPARING">En préparation</option>
    <option value="READY_FOR_DELIVERY">Prêt pour livraison</option>
    <option value="IN_DELIVERY">En livraison</option>
    <option value="DELIVERED">Livré</option>
    <option value="ACCEPTED">Accepté</option>
    <option value="CANCELLED">Annulé</option>
  </select>
  <span class="result-count">{{ filteredOrders.length }} résultat(s)</span>
</div>

<div class="loading" *ngIf="loading">
  <div class="spinner"></div>
  <span>Chargement...</span>
</div>

<div class="table-card" *ngIf="!loading">
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Référence</th>
          <th>Date</th>
          <th>Total</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of filteredOrders" class="clickable-row" [routerLink]="['/dashboard/shop/orders', o.id]">
          <td><strong>{{ o.reference }}</strong></td>
          <td>{{ o.createdAt | date:'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ o.total | number:'1.2-2' }} {{ o.currency }}</td>
          <td>
            <span class="payment-badge" [ngClass]="statusClass(o.status)">
              {{ statusLabel(o.status) }}
            </span>
          </td>
          <td class="actions" (click)="$event.stopPropagation()">
            <a class="btn btn-sm btn-secondary" [routerLink]="['/dashboard/shop/orders', o.id]">Détail</a>
            <button class="btn btn-sm btn-success" *ngIf="o.status === 'DELIVERED'" (click)="accept(o.id)">Accepter</button>
            <button class="btn btn-sm btn-danger" *ngIf="o.status === 'DELIVERED' || o.status === 'PENDING'" (click)="cancel(o.id)">Annuler</button>
          </td>
        </tr>
        <tr *ngIf="filteredOrders.length === 0">
          <td colspan="5" class="empty">Aucune commande trouvée</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
