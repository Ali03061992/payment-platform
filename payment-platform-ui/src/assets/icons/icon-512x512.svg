<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Credit card body -->
    <rect x="-140" y="-80" width="280" height="170" rx="16" fill="#ffffff" opacity="0.95"/>
    <!-- Magnetic stripe -->
    <rect x="-140" y="-40" width="280" height="30" fill="#1565c0" opacity="0.2"/>
    <!-- Chip -->
    <rect x="-110" y="-65" width="40" height="30" rx="4" fill="#f9a825"/>
    <line x1="-110" y1="-50" x2="-70" y2="-50" stroke="#f57f17" stroke-width="1.5"/>
    <line x1="-90" y1="-65" x2="-90" y2="-35" stroke="#f57f17" stroke-width="1.5"/>
    <!-- Contactless waves -->
    <g transform="translate(-55,-50)" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
      <path d="M0,0 a5,5 0 0,1 5,5"/>
      <path d="M-3,-3 a8,8 0 0,1 8,8"/>
      <path d="M-6,-6 a11,11 0 0,1 11,11"/>
    </g>
    <!-- Card number dots -->
    <circle cx="-100" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="-80" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="-60" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="-40" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="40" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="60" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="80" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <circle cx="100" cy="20" r="4" fill="#1565c0" opacity="0.4"/>
    <!-- Last 4 digits -->
    <text x="100" y="25" text-anchor="end" fill="#1565c0" font-family="monospace" font-size="16" font-weight="bold" opacity="0.6">4242</text>
    <!-- Dollar sign -->
    <text x="0" y="80" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-weight="bold" font-size="32" opacity="0.9">PAYMENT</text>
  </g>
</svg>
